<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Alphabet Match</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
</head>
<body>
<style>
  :root{
    --sky-top:#c9ecff;
    --sky-bottom:#e9fbf0;
    --card:#ffffff;
    --card-edge:#2e2d55;
    --sunshine:#ffd23f;
    --sunshine-edge:#e8a800;
    --coral:#ff6b6b;
    --grape:#6c4fd8;
    --leaf:#26b789;
    --ink:#2e2d55;
    --ink-soft:#6a6899;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Comic Sans MS",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
    color:var(--ink);
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    overflow:hidden;
  }
  button{
    font-family:inherit;
    color:inherit;
    cursor:pointer;
    border:none;
    background:none;
    touch-action:manipulation;
  }
  button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

  /* ---------- stage ---------- */
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(12px,2.5vh,28px);
    /* The page asks for viewport-fit=cover, so on a notched phone the stage
       runs under the notch and the home indicator. In a browser tab Safari's
       own chrome hides that; in the native shell nothing does. env() is 0
       wherever there is no inset, so this costs the desktop build nothing. */
    padding:
      calc(clamp(12px,3vw,32px) + env(safe-area-inset-top))
      calc(clamp(12px,3vw,32px) + env(safe-area-inset-right))
      calc(clamp(12px,3vw,32px) + env(safe-area-inset-bottom))
      calc(clamp(12px,3vw,32px) + env(safe-area-inset-left));
    text-align:center;
  }
  .hidden{display:none !important}

  /* ---------- painted sky ---------- */
  #sky{position:fixed;inset:0;pointer-events:none;z-index:0}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;
    top:0;left:0;right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    /* the mute and full-screen buttons sit here, so without the top inset
       they land underneath the notch on a modern phone */
    padding:
      calc(clamp(10px,2vw,18px) + env(safe-area-inset-top))
      calc(clamp(14px,3vw,24px) + env(safe-area-inset-right))
      clamp(10px,2vw,18px)
      calc(clamp(14px,3vw,24px) + env(safe-area-inset-left));
    z-index:5;
    pointer-events:none;
  }
  .topbar>*{pointer-events:auto}
  .topbar .right{display:flex;gap:10px;align-items:center}

  /* ---------- sticker jar ---------- */
  .jar{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.85);
    border:3px solid var(--card-edge);
    border-radius:999px;
    padding:4px 16px 4px 6px;
    font-size:clamp(18px,3vw,24px);
    font-weight:800;
    box-shadow:0 4px 0 rgba(46,45,85,.18);
    transition:transform .1s;
  }
  .jar:active{transform:scale(.94)}
  .jar-art{
    width:clamp(52px,7vw,68px);
    height:clamp(52px,7vw,68px);
    display:block;
  }
  .jar-art svg{width:100%;height:100%;display:block}
  .jar-done{
    font-size:clamp(14px,2.2vw,18px);
    background:var(--sunshine);
    border:2.5px solid var(--card-edge);
    border-radius:999px;
    padding:1px 9px;
  }
  @keyframes jar-shake{
    0%,100%{transform:none}
    20%{transform:translateY(-7px) rotate(-8deg)}
    45%{transform:translateY(-2px) rotate(7deg)}
    70%{transform:translateY(-5px) rotate(-4deg)}
  }
  .jar.full-pop{animation:jar-shake .7s ease}
  @keyframes jar-bump{
    0%,100%{transform:scale(1)}
    45%{transform:scale(1.18)}
  }
  .jar-art.bump{animation:jar-bump .3s ease}

  /* one star flies from the winning card into the jar per star earned */
  .flystar{
    position:fixed;
    left:0;top:0;
    z-index:30;
    pointer-events:none;
    font-size:clamp(26px,4vw,38px);
    line-height:1;
    will-change:transform,opacity;
  }

  /* ---------- sticker book ---------- */
  .book{
    position:fixed;
    inset:0;
    z-index:40;
    background:rgba(46,45,85,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(10px,2.5vw,28px);
  }
  .book-panel{
    background:linear-gradient(180deg,#fffdf5 0%,#ffffff 100%);
    border:5px solid var(--card-edge);
    border-radius:clamp(18px,3vw,30px);
    box-shadow:0 10px 0 rgba(46,45,85,.3);
    padding:clamp(14px,2.5vw,26px);
    width:min(940px,100%);
    max-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(8px,1.5vh,14px);
    animation:pop-in .35s cubic-bezier(.2,1.6,.4,1) both;
  }
  .book-title{
    font-size:clamp(22px,4vw,34px);
    font-weight:900;
    margin:0;
  }
  .book-progress{
    font-size:clamp(15px,2.4vw,20px);
    font-weight:800;
    color:var(--ink-soft);
    margin:0;
  }
  .book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(clamp(60px,8.5vw,104px),1fr));
    gap:clamp(8px,1.4vw,14px);
    width:100%;
    flex:1 1 auto;
    min-height:0;          /* or the grid refuses to shrink and scroll */
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    padding:8px 4px;
  }
  .slot{
    position:relative;
    aspect-ratio:1/1;
    background:#f2f4fb;
    border:3px dashed #b9bede;
    border-radius:clamp(10px,1.8vw,16px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(22px,3.6vw,36px);
    font-weight:900;
    color:#b9bede;
    padding:6px;
  }
  .slot.got{
    background:var(--card);
    border:3px solid var(--card-edge);
    box-shadow:0 4px 0 rgba(46,45,85,.2);
    color:var(--ink);
    transition:transform .1s;
  }
  .slot.got:active{transform:scale(.93)}
  .slot.got svg{width:100%;height:100%}
  .slot .tag{
    position:absolute;
    left:-5px;bottom:-6px;
    font-size:clamp(12px,1.7vw,16px);
    font-weight:900;
    background:var(--grape);
    color:#fff;
    border:2.5px solid var(--card-edge);
    border-radius:999px;
    padding:0 7px;
  }
  .slot .badge{
    position:absolute;
    right:-6px;top:-7px;
    min-width:23px;height:23px;
    border-radius:999px;
    background:var(--sunshine);
    border:2.5px solid var(--card-edge);
    font-size:13px;
    font-weight:900;
    display:flex;align-items:center;justify-content:center;
    padding:0 4px;
  }
  .book-reset{
    font-size:16px;
    font-weight:800;
    color:var(--coral);
    border:3px solid var(--coral);
    border-radius:999px;
    padding:6px 18px;
  }
  .book-reset.armed{background:var(--coral);color:#fff}

  /* ---------- grown-ups panel ---------- */
  #grownups{z-index:41}
  .gu-body{
    width:100%;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    flex:1 1 auto;
    min-height:0;
    padding:0 2px;
  }
  .gu-label{
    display:block;
    font-size:clamp(15px,2.2vw,18px);
    font-weight:900;
    color:var(--ink);
    margin:10px 0 6px;
  }
  .gu-input{
    font-family:inherit;
    font-size:clamp(18px,2.6vw,22px);
    font-weight:800;
    color:var(--ink);
    width:100%;
    background:#f2f4fb;
    border:3px solid var(--card-edge);
    border-radius:14px;
    padding:9px 14px;
  }
  .gu-input:focus{outline:4px solid var(--grape);outline-offset:2px}
  .gu-note{
    font-size:clamp(12px,1.8vw,14px);
    font-weight:700;
    color:var(--ink-soft);
    margin:5px 0 0;
  }
  .gu-presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .gu-chip{
    font-size:clamp(13px,1.9vw,15px);
    font-weight:800;
    background:#fff;
    border:3px solid var(--card-edge);
    border-radius:999px;
    padding:5px 14px;
  }
  .gu-chip:disabled{opacity:.35;cursor:default}
  .gu-letters{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(clamp(38px,5vw,50px),1fr));
    gap:6px;
  }
  .gu-letter{
    aspect-ratio:1/1;
    font-size:clamp(15px,2.2vw,20px);
    font-weight:900;
    background:#f2f4fb;
    color:#b9bede;
    border:3px solid #d3d7ea;
    border-radius:11px;
  }
  .gu-letter.on{
    background:linear-gradient(180deg,#ffe07a 0%,var(--sunshine) 100%);
    border-color:var(--sunshine-edge);
    color:var(--ink);
  }
  .gu-actions{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .round-btn{
    width:clamp(48px,7vw,58px);
    height:clamp(48px,7vw,58px);
    border-radius:50%;
    background:rgba(255,255,255,.85);
    border:3px solid var(--card-edge);
    font-size:clamp(20px,3vw,26px);
    box-shadow:0 4px 0 rgba(46,45,85,.18);
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s;
  }
  .round-btn:active{transform:scale(.9)}
  .round-btn svg{width:52%;height:52%;display:block}

  /* ---------- start screen ---------- */
  .start-title{
    font-size:clamp(34px,7vw,60px);
    font-weight:900;
    margin:0;
    letter-spacing:.02em;
    text-wrap:balance;
  }
  .start-blocks{
    display:flex;
    align-items:center;
    gap:clamp(8px,2vw,16px);
  }
  .start-blocks span{
    display:flex;
    align-items:center;
    justify-content:center;
    width:clamp(56px,11vw,92px);
    height:clamp(56px,11vw,92px);
    animation:bob 2.2s ease-in-out infinite;
  }
  .start-blocks svg{width:100%;height:100%}
  .mini-letter{
    font-size:clamp(30px,6vw,52px);
    font-weight:900;
    background:linear-gradient(180deg,#ffe07a 0%,var(--sunshine) 100%);
    border:4px solid var(--sunshine-edge);
    border-radius:clamp(12px,2vw,18px);
    box-shadow:0 5px 0 var(--sunshine-edge);
    color:var(--ink);
  }
  .mini-letter.alt{
    background:linear-gradient(180deg,#ffb3c8 0%,#ff9ecd 100%);
    border-color:#e0679f;
    box-shadow:0 5px 0 #e0679f;
  }
  .start-blocks span:nth-child(2){animation-delay:.25s}
  .start-blocks span:nth-child(3){animation-delay:.5s}
  .start-blocks span:nth-child(4){animation-delay:.75s}
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-14px)}
  }
  .big-btn{
    font-size:clamp(24px,5vw,34px);
    font-weight:900;
    letter-spacing:.03em;
    background:var(--leaf);
    color:#fff;
    border:4px solid var(--card-edge);
    border-radius:999px;
    padding:clamp(16px,3vh,22px) clamp(40px,8vw,64px);
    box-shadow:0 7px 0 rgba(46,45,85,.35);
    transition:transform .1s, box-shadow .1s;
  }
  .big-btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(46,45,85,.35)}
  .big-btn.next{background:var(--coral)}

  /* ---------- play screen ---------- */
  .prompt-row{
    display:flex;
    align-items:center;
    gap:clamp(12px,3vw,24px);
  }
  .letter-block{
    font-size:clamp(72px,16vh,150px);
    font-weight:900;
    line-height:1;
    background:linear-gradient(180deg,#ffe07a 0%,var(--sunshine) 100%);
    border:5px solid var(--sunshine-edge);
    border-radius:clamp(18px,3vw,28px);
    padding:clamp(14px,2.5vh,26px) clamp(24px,4.5vh,44px);
    box-shadow:0 8px 0 var(--sunshine-edge), 0 14px 22px rgba(46,45,85,.18);
    color:var(--ink);
    animation:pop-in .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  .letter-block .lower{font-size:.72em;margin-left:.14em}
  /* The reverse round's prompt: the picture asks the question instead. It
     wears the same yellow as the letter block so the rule holds in both
     directions — yellow is the question, white cards are the answers — but
     the art keeps a white mat behind it, or a banana would vanish into it. */
  .picture-block{
    width:clamp(128px,25vh,210px);
    height:clamp(128px,25vh,210px);
    background:linear-gradient(180deg,#ffe07a 0%,var(--sunshine) 100%);
    border:5px solid var(--sunshine-edge);
    border-radius:clamp(18px,3vw,28px);
    box-shadow:0 8px 0 var(--sunshine-edge), 0 14px 22px rgba(46,45,85,.18);
    padding:clamp(9px,1.8vw,16px);
    animation:pop-in .45s cubic-bezier(.2,1.6,.4,1) both;
    transition:transform .1s;
  }
  .picture-block:active{transform:scale(.94)}
  .picture-block .mat{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    background:var(--card);
    border-radius:clamp(10px,1.8vw,16px);
    padding:clamp(4px,1vw,9px);
  }
  .picture-block svg{width:100%;height:100%;display:block}
  .speak-btn{
    width:clamp(58px,9vw,72px);
    height:clamp(58px,9vw,72px);
    border-radius:50%;
    background:var(--grape);
    border:4px solid var(--card-edge);
    font-size:clamp(24px,4vw,32px);
    box-shadow:0 5px 0 rgba(46,45,85,.35);
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s;
  }
  .speak-btn:active{transform:scale(.9)}
  .prompt-text{
    font-size:clamp(18px,3.2vw,26px);
    font-weight:800;
    color:var(--ink-soft);
    margin:0;
  }
  .cards{
    display:flex;
    justify-content:center;
    gap:clamp(10px,2.5vw,28px);
    width:100%;
    max-width:920px;
  }
  .card{
    flex:1 1 0;
    min-width:0;      /* letters have an intrinsic width; without this a row
                         of four refuses to shrink and runs off a phone */
    max-width:270px;
    aspect-ratio:1/1.06;
    background:var(--card);
    border:5px solid var(--card-edge);
    border-radius:clamp(20px,3.5vw,32px);
    box-shadow:0 8px 0 rgba(46,45,85,.22);
    padding:clamp(10px,2vw,20px);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s, box-shadow .12s, opacity .3s;
    animation:pop-in .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  .card:nth-child(2){animation-delay:.08s}
  .card:nth-child(3){animation-delay:.16s}
  .card:nth-child(4){animation-delay:.24s}
  .card:active{transform:scale(.94) translateY(4px);box-shadow:0 3px 0 rgba(46,45,85,.22)}
  .card svg{width:100%;height:100%}
  /* a card holding a letter rather than a picture — same white card as any
     other answer, so the .wrong/.right states read identically */
  .card.letter-card{
    /* sized against width as well as height: four "Ww" tiles across a phone
       are what actually runs out of room, not a tall screen */
    font-size:clamp(24px,min(9vh,9vw),84px);
    font-weight:900;
    line-height:1;
    color:var(--ink);
  }
  .card.letter-card .lower{font-size:.72em;margin-left:.1em}
  .card.wrong{
    animation:wiggle .5s ease;
    opacity:.35;
    pointer-events:none;
  }
  .card.right{
    animation:cheer .6s cubic-bezier(.2,1.6,.4,1);
    background:#eafff4;
    border-color:var(--leaf);
    box-shadow:0 8px 0 rgba(38,183,137,.5);
  }
  /* the nudge for a child who has stalled. The green ring carries the hint
     on its own, so it still reads when the bob is switched off below. */
  .card.hint{
    animation:hint-bob 1.5s ease-in-out infinite;
    border-color:var(--leaf);
    box-shadow:0 8px 0 rgba(38,183,137,.45), 0 0 0 9px rgba(38,183,137,.3);
  }
  @keyframes hint-bob{
    0%,100%{transform:translateY(0)}
    28%{transform:translateY(-18px)}
    52%{transform:translateY(0)}
    72%{transform:translateY(-8px)}
    88%{transform:translateY(0)}
  }
  @keyframes pop-in{
    from{transform:scale(.3);opacity:0}
    to{transform:scale(1);opacity:1}
  }
  @keyframes wiggle{
    0%,100%{transform:translateX(0) rotate(0)}
    20%{transform:translateX(-12px) rotate(-4deg)}
    40%{transform:translateX(12px) rotate(4deg)}
    60%{transform:translateX(-9px) rotate(-3deg)}
    80%{transform:translateX(9px) rotate(3deg)}
  }
  @keyframes cheer{
    0%{transform:scale(1)}
    40%{transform:scale(1.18) rotate(-3deg)}
    70%{transform:scale(1.08) rotate(2deg)}
    100%{transform:scale(1.12)}
  }

  /* ---------- victory screen ---------- */
  .victory-art{
    width:clamp(130px,24vh,210px);
    height:clamp(130px,24vh,210px);
    animation:bounce-big .9s cubic-bezier(.3,1.6,.4,1) both;
    cursor:pointer;
    transition:transform .1s;
  }
  .victory-art:active{transform:scale(.93)}
  .victory-art svg{width:100%;height:100%;display:block}
  @keyframes bounce-big{
    0%{transform:scale(0) rotate(-15deg)}
    55%{transform:scale(1.2) rotate(6deg)}
    100%{transform:scale(1) rotate(0)}
  }
  .word-tiles{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:clamp(6px,1.5vw,12px);
  }
  .tile{
    font-size:clamp(30px,7vw,60px);
    font-weight:900;
    line-height:1;
    background:var(--card);
    border:4px solid var(--card-edge);
    border-radius:clamp(10px,2vw,16px);
    padding:clamp(10px,2vh,18px) clamp(12px,2.4vh,22px);
    box-shadow:0 5px 0 rgba(46,45,85,.22);
    animation:tile-pop .4s cubic-bezier(.2,1.6,.4,1) both;
  }
  .tile.first{
    background:linear-gradient(180deg,#ffe07a 0%,var(--sunshine) 100%);
    border-color:var(--sunshine-edge);
    box-shadow:0 5px 0 var(--sunshine-edge);
  }
  @keyframes tile-pop{
    from{transform:scale(0) translateY(20px);opacity:0}
    to{transform:scale(1) translateY(0);opacity:1}
  }
  .is-for{
    font-size:clamp(22px,4.5vw,36px);
    font-weight:900;
    margin:0;
    color:var(--grape);
  }
  .victory-stars{
    display:flex;
    justify-content:center;
    gap:clamp(8px,2vw,16px);
    font-size:clamp(32px,6.5vw,52px);
    line-height:1;
    min-height:1.2em;
  }
  .victory-stars .won{
    display:inline-block;
    animation:tile-pop .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  .victory-stars .lost{opacity:.22;filter:grayscale(1)}

  /* confetti canvas */
  #confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
  }

  /* narrow phones: "W w" plus the speak button must still fit across */
  @media (max-width:480px){
    .letter-block{font-size:clamp(56px,12vh,104px);padding:clamp(12px,2vh,20px) clamp(18px,3.5vh,32px)}
  }

  /* short screens (phone landscape): tighten play screen */
  @media (max-height:520px){
    .letter-block{font-size:clamp(56px,18vh,90px);padding:10px 26px}
    .prompt-text{display:none}
    .stage{gap:10px}
    .victory-art{width:clamp(80px,26vh,120px);height:clamp(80px,26vh,120px)}
    /* give the book back the room the chrome was eating, so more than one
       row of stickers is visible before it has to scroll */
    .book-panel{padding:10px 14px;gap:6px}
    .book-title{font-size:22px}
    .book-progress{font-size:14px}
    .book-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px;padding:6px 3px}
    .book-panel .big-btn{font-size:20px;padding:9px 34px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01s !important;animation-delay:0s !important;transition-duration:.01s !important}
  }
</style>

<canvas id="sky"></canvas>
<canvas id="confetti"></canvas>

<div class="topbar">
  <button class="jar" id="jar-btn" aria-label="Open your sticker book">
    <span class="jar-art" id="jar-art"></span>
    <span id="star-count">0</span>
    <span class="jar-done hidden" id="jar-done"></span>
  </button>
  <div class="right">
    <button class="round-btn hidden" id="full-btn" aria-label="Fill the whole screen"></button>
    <button class="round-btn" id="mute-btn" aria-label="Turn sound on or off">🔊</button>
  </div>
</div>

<!-- START -->
<div class="stage" id="screen-start">
  <div class="start-blocks" aria-hidden="true">
    <span class="mini-letter">A</span><span id="start-art-1"></span><span class="mini-letter alt">B</span><span id="start-art-2"></span>
  </div>
  <h1 class="start-title" id="start-title">Alphabet Match!</h1>
  <button class="big-btn" id="play-btn">▶&nbsp; PLAY</button>
</div>

<!-- PLAY -->
<div class="stage hidden" id="screen-play">
  <div class="prompt-row">
    <div class="letter-block" id="letter-block">B<span class="lower">b</span></div>
    <button class="picture-block hidden" id="picture-block" aria-label="Hear this again"></button>
    <button class="speak-btn" id="repeat-btn" aria-label="Hear it again">🔊</button>
  </div>
  <p class="prompt-text" id="prompt-text">Which picture starts with this letter?</p>
  <div class="cards" id="cards"></div>
</div>

<!-- VICTORY -->
<div class="stage hidden" id="screen-victory">
  <div class="victory-art" id="victory-art"></div>
  <p class="is-for" id="is-for">B is for…</p>
  <div class="word-tiles" id="word-tiles"></div>
  <div class="victory-stars" id="victory-stars"></div>
  <button class="big-btn next" id="next-btn">NEXT &nbsp;▶</button>
</div>

<!-- STICKER BOOK -->
<div class="book hidden" id="book">
  <div class="book-panel">
    <h2 class="book-title" id="book-title">My Sticker Book</h2>
    <p class="book-progress" id="book-progress"></p>
    <div class="book-grid" id="book-grid"></div>
    <button class="big-btn" id="book-close">DONE</button>
  </div>
</div>

<!-- GROWN-UPS (long-press the sticker book title) -->
<div class="book hidden" id="grownups">
  <div class="book-panel">
    <h2 class="book-title">For grown-ups</h2>
    <div class="gu-body">
      <label class="gu-label" for="name-input">Child's name</label>
      <input class="gu-input" id="name-input" type="text" maxlength="20"
             placeholder="(optional)" autocomplete="off" autocapitalize="words" spellcheck="false">
      <p class="gu-note">Used in the cheers, and on the title.</p>

      <label class="gu-label">Letters in play</label>
      <div class="gu-presets">
        <button class="gu-chip" id="pick-all">All letters</button>
        <button class="gu-chip" id="pick-name">Just the name</button>
      </div>
      <div class="gu-letters" id="gu-letters"></div>
      <p class="gu-note" id="gu-count"></p>
    </div>
    <div class="gu-actions">
      <button class="book-reset" id="book-reset">Erase stars and stickers</button>
      <button class="big-btn" id="gu-close">DONE</button>
    </div>
  </div>
</div>

<!-- The word bank and every spoken line live out here rather than inside the
     game's closure, because two things read them: the game below, and the
     voice-over build, which evaluates this block in plain Node with no
     browser and no DOM. Nothing in here may touch the document. -->
<!-- Capacitor's plugin proxies. A copy of @capacitor/core's browser build,
     refreshed by `npm run vendor` — the plugins' own npm packages are ESM and
     this app has no bundler, so registerPlugin() is how it reaches them. In a
     browser it loads, finds no native bridge, reports the platform as "web",
     and nothing below asks it for anything. -->
<script src="capacitor.js"></script>
<!-- shared with number-friends; the original lives in voice-kit, don't edit this copy -->
<script src="voice-player.js"></script>

<script id="voice-data">
(function(){
  "use strict";

  /* ---------------- word bank ---------------- */
  // Words chosen for 3-5 year olds: concrete, familiar things a child can
  // name from a picture (no symbols or abstract ideas).
  var WORDS = {
    A:["APPLE","ANT","AIRPLANE","ALLIGATOR"],
    B:["BALL","BANANA","BEAR","BEE","BUS","BUTTERFLY"],
    C:["CAT","CAR","CAKE","COW","CARROT"],
    D:["DOG","DUCK","DINOSAUR","DONUT","DRUM"],
    E:["ELEPHANT","EGG","EAGLE","EXCAVATOR"],
    F:["FISH","FROG","FLOWER","FOX","FIRE TRUCK"],
    G:["GRAPES","GIFT","GIRAFFE","GUITAR"],
    H:["HAT","HOUSE","HEART","HORSE","HELICOPTER"],
    I:["ICE CREAM","IGLOO","ISLAND"],
    J:["JUICE","JELLYFISH","JACKET"],
    K:["KITE","KEY","KOALA","KANGAROO"],
    L:["LION","LEMON","LEAF","LADYBUG"],
    M:["MONKEY","MOON","MUSHROOM","MOUSE","MILK"],
    N:["NEST","NOODLES","NUT"],
    O:["OCTOPUS","ORANGE","OWL"],
    P:["PIG","PIZZA","PENGUIN","PINEAPPLE","PANDA"],
    Q:["QUEEN","QUILT"],
    R:["RAINBOW","ROCKET","RABBIT","ROBOT"],
    S:["SUN","STAR","SNAKE","STRAWBERRY","SHEEP"],
    T:["TREE","TRAIN","TURTLE","TIGER"],
    U:["UMBRELLA","UNICORN"],
    V:["VAN","VIOLIN","VOLCANO"],
    W:["WHALE","WATERMELON","WORM","WAGON"],
    X:["X-RAY","XYLOPHONE"],
    Y:["YO-YO","YARN","YOGURT"],
    Z:["ZEBRA","ZIPPER"]
  };
  var LETTERS = Object.keys(WORDS);

// "X-RAY" reads as "ex ray", "ICE CREAM" as written. Hyphens would
  // otherwise be spelled out or swallowed depending on the voice.
  function sayable(word){ return word.toLowerCase().replace(/-/g, " "); }

  /* ---------------- voice lines ---------------- */
  // Every spoken line in the game lives in this table and nowhere else.
  // Call sites name a line and fill its slots; they never build a sentence.
  //
  // The table is also the manifest the voice-over build reads: it renders
  // one audio clip per line per slot combination, named by clipId(). That
  // only stays honest if the slot domains come from the game's own word
  // list rather than being restated here — a domain that drifted would
  // ship a round with no clip to play and the child would hear silence.
  //
  //   over     which domain to enumerate when recording
  //   dynamic  interpolates the child's typed name, so it can never be a
  //            recording; falls back to the nameless clip once we switch
  var PRAISE = [
    { id:"yay",         t:"Yay!" },
    { id:"woo-hoo",     t:"Woo hoo!" },
    { id:"hooray",      t:"Hooray!" },
    { id:"great-job",   t:"Great job!" },
    { id:"you-did-it",  t:"You did it!" },
    { id:"amazing",     t:"Amazing!" },
    { id:"super-duper", t:"Super duper!" },
    { id:"high-five",   t:"High five!" }
  ];
  function praiseText(id){
    for(var i=0;i<PRAISE.length;i++) if(PRAISE[i].id === id) return PRAISE[i].t;
    return PRAISE[0].t;
  }
  var ALL_WORDS = LETTERS.reduce(function(a, l){ return a.concat(WORDS[l]); }, []);
  var VOICE_DOMAINS = {
    none:   { keys: [], all: function(){ return [{}]; } },
    letter: { keys: ["letter"], all: function(){
                return LETTERS.map(function(l){ return { letter: l }; }); } },
    word:   { keys: ["word"], all: function(){
                return ALL_WORDS.map(function(w){ return { word: w }; }); } },
    // only the letter/word pairs the game can actually say — 99 of them,
    // not the 26 x 99 grid, which would record "B is for apple"
    pair:   { keys: ["letter","word"], all: function(){
                return LETTERS.reduce(function(a, l){
                  return a.concat(WORDS[l].map(function(w){ return { letter: l, word: w }; }));
                }, []); } },
    praise: { keys: ["praise"], all: function(){
                return PRAISE.map(function(p){ return { praise: p.id }; }); } }
  };
  var LINES = {
    "letter.excl":        { over:"letter", pitch:1.2,  rate:0.9,
      text: function(s){ return s.letter + "!"; } },
    "word.excl":          { over:"word",   pitch:1.2,  rate:0.9,
      text: function(s){ return sayable(s.word) + "!"; } },
    "prompt.find":        { over:"letter", pitch:1.05, rate:0.95,
      text: function(s){ return "Find the picture that starts with " + s.letter + "!"; } },
    "prompt.which":       { over:"word",   pitch:1.05, rate:0.95,
      text: function(s){ return "Which letter does " + sayable(s.word) + " start with?"; } },
    "teach.is-for":       { over:"pair",   pitch:1.1,  rate:0.85,
      text: function(s){ return s.letter + " is for " + sayable(s.word) + "!"; } },
    "teach.starts-with":  { over:"pair",   pitch:1.05, rate:0.9,
      text: function(s){ return sayable(s.word) + " starts with " + s.letter + "!"; } },
    // Follows a teaching line rather than being baked into one, so the two
    // teaching lines are recorded once each and reused everywhere. It only
    // ever lands on a sentence boundary, where a join is inaudible.
    "retry.try-again":    { over:"none",   pitch:1.05, rate:0.9,
      text: function(){ return "Try again!"; } },
    "cheer.praise":       { over:"praise", pitch:1.3,  rate:1.05,
      text: function(s){ return praiseText(s.praise); } },
    "cheer.jar":          { over:"none",   pitch:1.3,  rate:1.05,
      text: function(){ return "You filled the whole jar!"; } },
    "cheer.praise.named": { dynamic:true, fallback:"cheer.praise", pitch:1.3, rate:1.05,
      text: function(s){ return praiseText(s.praise).replace(/!+$/, "") + ", " + s.name + "!"; } },
    "cheer.jar.named":    { dynamic:true, fallback:"cheer.jar", pitch:1.3, rate:1.05,
      text: function(s){ return "You filled the whole jar, " + s.name + "!"; } }
  };
  function slug(v){ return String(v).replace(/[^A-Za-z0-9]+/g, "_"); }
  function clipId(id, slots){
    var L = LINES[id];
    if(!L || L.dynamic) return null;      // nothing to record
    return VOICE_DOMAINS[L.over].keys.reduce(function(s, k){
      return s + "." + slug(slots[k]);
    }, id);
  }
  // One spoken part, ready for the player. `tweak` nudges delivery for a
  // call site that wants the same words softer or bouncier; it only reaches
  // the synthesiser, since a recorded clip has the one delivery it was cut
  // with. Keep tweaks small enough that losing them changes nothing much.
  // Set once the recorded pack is in use. A dynamic line can never be a
  // recording, and mixing a synthesised voice in beside the narrator's is
  // worse than losing the name — so those lines resolve to the nameless
  // twin they nominated. Hearing "Great job!" in the right voice beats
  // hearing "Great job, Ada!" in a stranger's.
  var recorded = false;
  function line(id, slots, tweak){
    var L = LINES[id];
    if(!L){
      if(window.console) console.warn("no such voice line: " + id);
      return null;
    }
    if(recorded && L.dynamic && LINES[L.fallback]){
      id = L.fallback;
      L = LINES[id];
    }
    slots = slots || {};
    return {
      line:  id,
      clip:  clipId(id, slots),
      t:     L.text(slots),
      pitch: (tweak && tweak.pitch) || L.pitch,
      rate:  (tweak && tweak.rate)  || L.rate
    };
  }
  // What the voice-over build enumerates: every clip the game can ask for.
  function voiceManifest(){
    var out = [];
    Object.keys(LINES).forEach(function(id){
      var L = LINES[id];
      if(L.dynamic) return;
      VOICE_DOMAINS[L.over].all().forEach(function(slots){
        // `flow` says where a fragment sits in the sentence it is heard
        // in, so the recording is not read as a line said on its own.
        // Nothing here is spliced, so nothing sets it — it is carried
        // anyway, so that the day a line does get split the build
        // already knows what to do with it.
        out.push({ clip: clipId(id, slots), line: id, text: L.text(slots),
                   pitch: L.pitch, rate: L.rate, flow: L.flow });
      });
    });
    return out;
  }

  window.GAME_DATA = { WORDS: WORDS, LETTERS: LETTERS, sayable: sayable };
  window.VOICE = {
    LINES: LINES, DOMAINS: VOICE_DOMAINS, PRAISE: PRAISE,
    line: line, clipId: clipId, manifest: voiceManifest,
    useRecorded: function(on){ recorded = on; }
  };
})();
</script>

  /* ---------------- state ---------------- */
  var deck = [];          // shuffled letters, so every letter shows up before repeats
  var current = null;     // {letter, word}
  var stars = 0;          // lifetime total, restored from storage
  var shownStars = 0;     // what the jar is painted with; trails `stars` while
                          // the stars just earned are still flying into it
  var sessionStars = 0;   // music energy builds per sitting, not per lifetime —
                          // a returning child should still hear the band arrive
  var book = {};          // letter -> [words collected], newest last
  var childName = "";     // optional, set by a grown-up; used in the cheers
  var letterSet = null;   // null means the whole alphabet is in play
  var muted = false;
  var solvedThisRound = false;
  var wrongTaps = 0;
  var earnedThisRound = 0;
  var filledJarThisRound = false;
  var holdVictory = false;      // child is playing with the picture; don't move on
  var level = 2;                // cards on the table: 2, 3 or 4
  var cleanStreak = 0;          // consecutive rounds solved without a miss
  var correctBtn = null;        // the card to nudge if they get stuck
  var mode = "normal";          // "normal": letter asks. "reverse": picture asks.
  var hintTimer = null;
  var promptTimer = null;
  var autoAdvanceTimer = null;
  var victoryDelayTimer = null;
  var victorySpeechTimer = null;
  var wrongSpeechTimer = null;
  var victorySoundTimers = [];  // scheduled tile chimes and star tones

  var $ = function(id){ return document.getElementById(id); };
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  /* ---------------- saved progress ---------------- */
  // Stars and the sticker book outlive the tab. A four-year-old's session
  // ends when the tablet gets taken away, and losing the jar along with it
  // is the quickest way to make the game not worth starting again.
  // Storage can be unavailable (private mode, a blocked third-party frame);
  // the game just plays without memory then rather than falling over.
  var SAVE_KEY = "alphabet-match.v1";
  function loadProgress(){
    try{
      var d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if(!d) return;
      if(typeof d.stars === "number" && isFinite(d.stars)) stars = Math.max(0, Math.floor(d.stars));
      // a child who has already worked up to four cards shouldn't be sent
      // back to two just because they closed the tab
      if(typeof d.level === "number" && d.level >= MIN_CARDS && d.level <= MAX_CARDS) level = Math.floor(d.level);
      if(typeof d.name === "string") childName = d.name.slice(0, NAME_MAX);
      if(d.letters instanceof Array){
        var keep = d.letters.filter(function(l){ return LETTERS.indexOf(l) !== -1; });
        // a set of one leaves nothing to choose between; the whole alphabet
        // is just the default, stored as null
        if(keep.length >= 2 && keep.length < LETTERS.length) letterSet = keep.sort();
      }
      if(d.book){
        LETTERS.forEach(function(l){
          var got = d.book[l];
          if(!(got instanceof Array)) return;
          // drop any word the game no longer has a drawing for
          var keep = got.filter(function(w){ return WORDS[l].indexOf(w) !== -1; });
          if(keep.length) book[l] = keep;
        });
      }
    }catch(e){}
  }
  // The packaged builds hang a second, durable copy off this — see the
  // native shell at the bottom of the file. Nothing else sets it.
  var onProgressSaved = null;
  function saveProgress(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        stars: stars, book: book, level: level, name: childName, letters: letterSet
      }));
    }catch(e){}
    if(onProgressSaved) onProgressSaved();
  }
  // Re-finding a letter moves that word to the top of its pile, so the book
  // shows the most recent one and the child can discover that B is a bee
  // *and* a bus.
  function collect(letter, word){
    var got = book[letter] || (book[letter] = []);
    var at = got.indexOf(word);
    if(at !== -1) got.splice(at, 1);

  var actx = null;
  function audio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();

    if(actx && actx.state === "suspended") actx.resume();
    return actx;

  function tone(freq, start, dur, type, vol){
    var ctx = audio(); if(!ctx || muted) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "triangle";
    o.frequency.value = freq;
    var t = ctx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);

  /* ---------------- picture sounds ----------------
     Every card can make its own noise, because "the cow moos when you tap
     it" is the part a three-year-old actually plays for. These are all
     synthesised — cartoon impressions rather than recordings — so the game
     stays one file with nothing to download and nothing to go missing.  */
  var sfxBus = null;
  function sfxCtx(){
    if(muted) return null;
    var ctx = audio();
    if(!ctx) return null;
    if(!sfxBus){
      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.9;
      sfxBus.connect(ctx.destination);
    }
    return ctx;
  }
  // A tone sliding through [second, hz] points. A band/low-pass gives it a
  // throat, and `vib` adds the wobble that turns a flat tone into a bleat,
  // a growl or a buzz. Nearly every voice below is one or two of these.
  function slide(pts, dur, type, vol, at, o){
    var ctx = sfxCtx(); if(!ctx) return;
    o = o || {};
    var t = ctx.currentTime + (at || 0);
    var osc = ctx.createOscillator(), g = ctx.createGain(), tail = osc;
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(Math.max(20, pts[0][1]), t);
    for(var i=1;i<pts.length;i++){
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, pts[i][1]), t + pts[i][0]);
    }
    if(o.filter){
      var f = ctx.createBiquadFilter();
      f.type = o.filter;
      f.frequency.value = o.hz || 1200;
      f.Q.value = o.q || 5;
      osc.connect(f);
      tail = f;
    }
    var atk = o.attack || 0.015;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + atk);
    var hold = Math.max(atk + 0.001, dur * (o.hold == null ? 0.55 : o.hold));
    if(hold < dur) g.gain.setValueAtTime(vol, t + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    tail.connect(g).connect(sfxBus);
    if(o.vib){
      var lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = o.vib;
      lg.gain.value = o.vibDepth || 14;
      lfo.connect(lg).connect(osc.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  // Noise swept through a moving filter: everything breathy, splashy,
  // crunchy or windy is made of this.
  var noiseBuf = null;
  function rush(filterType, pts, dur, vol, at, q){
    var ctx = sfxCtx(); if(!ctx) return;
    if(!noiseBuf){
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.2), ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    }
    var t = ctx.currentTime + (at || 0);
    var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf;
    src.loop = true;
    f.type = filterType;
    f.Q.value = q || 1;
    f.frequency.setValueAtTime(Math.max(30, pts[0][1]), t);
    for(var j=1;j<pts.length;j++){
      f.frequency.exponentialRampToValueAtTime(Math.max(30, pts[j][1]), t + pts[j][0]);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(sfxBus);
    src.start(t); src.stop(t + dur + 0.05);
  }

        ], { duration: 620, delay: 120 + i*150, easing: "cubic-bezier(.4,0,.55,1)", fill: "both" });
        var landed = false;
        var land = function(){
          if(landed) return;
          landed = true;
          if(el.parentNode) el.parentNode.removeChild(el);
          if(shownStars >= stars) return;
          shownStars++;
          paintJar();
          bumpJar();
          tone(880 * Math.pow(1.18, i), 0, 0.22, "triangle", 0.15);
          if(jarParts(shownStars).inJar === JAR) celebrateJar();
        };
        anim.onfinish = land;
        // a backstop: animation callbacks don't fire in a backgrounded tab
        setTimeout(land, 900 + i*150);
      })(i);
    }
  }
  // Anything still in flight when the next round starts is abandoned; make
  // sure the jar ends up showing the true total either way.
  function settleJar(){
    var flying = document.querySelectorAll(".flystar");
    for(var i=0;i<flying.length;i++) flying[i].parentNode.removeChild(flying[i]);
    if(shownStars !== stars){
      shownStars = stars;
      paintJar();
    }
  }

  /* ---------------- sticker book ----------------
     The payoff for keeping progress: 26 slots, and a picture appears in one
     the first time that letter is matched. Finding B again with a different
     word swaps the sticker and adds to the count, which is what makes a
     child want to keep playing past the letters they already know.       */
  function renderBook(){
    var grid = $("book-grid");
    grid.innerHTML = "";
    var found = 0;
    LETTERS.forEach(function(l){
      var words = book[l];
      var cell = document.createElement(words ? "button" : "div");
      cell.className = "slot" + (words ? " got" : "");
      if(!words){
        cell.textContent = l;
        cell.setAttribute("aria-label", l + ", not found yet");
        grid.appendChild(cell);
        return;
      }
      found++;
      var word = words[words.length - 1];
      cell.innerHTML = ART[word];
      cell.setAttribute("aria-label", l + " is for " + word.toLowerCase());
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = l;
      cell.appendChild(tag);
      if(words.length > 1){
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = words.length;
        cell.appendChild(badge);
      }
      cell.addEventListener("click", function(){
        playPicture(word);
        speakParts([line("teach.is-for", { letter: l, word: word }, { rate: 0.9 })]);
      });
      grid.appendChild(cell);
    });
    $("book-progress").textContent = found + " of " + LETTERS.length + " letters found";
  }
  function openBook(){
    clearTimeout(autoAdvanceTimer);
    settleJar();
    renderBook();
    $("book").classList.remove("hidden");
  }
  function closeBook(){
    $("book").classList.add("hidden");
    $("book-reset").classList.add("hidden");
    // the victory screen was mid-countdown when the book opened — restart it,
    // unless the child had already asked to stay by poking the picture
    if(!holdVictory && !$("screen-victory").classList.contains("hidden")){
      clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = setTimeout(newRound, 4000);
    }
  }

  /* ---------------- painted sky ---------------- */
  // Everything in the background is drawn by hand on one canvas so the
  // whole scene shares a single soft cartoon style.
  (function initSky(){
    var cv = $("sky"), s2 = cv.getContext("2d");
    var TAU = Math.PI*2;
    var W = 0, H = 0, U = 1;
    function resize(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W*dpr; cv.height = H*dpr;
      s2.setTransform(dpr,0,0,dpr,0,0);
      U = Math.max(Math.min(W,H)/700, 0.55);
      if(reducedMotion) draw(20);
    }
    window.addEventListener("resize", resize);

    var CLOUDS = [
      {y:.09, s:1.15, v:14, o:100},
      {y:.20, s:.80,  v:9,  o:520},
      {y:.30, s:.55,  v:18, o:980},
      {y:.05, s:.90,  v:6,  o:1500}
    ];

    /* ---- tappable scenery ----
       Everything in the sky answers back when poked. Each shape records
       where it just drew itself, so the hit targets follow the animation
       rather than guessing at where a plane might be. */
    var spots = [];
    var poked = {};
    function mark(kind, x, y, r){ spots.push({ kind:kind, x:x, y:y, r:r }); }
    // a decaying wobble, ±1, for the ~700ms after something is tapped
    function wob(kind){
      var at = poked[kind];
      if(at == null) return 0;
      var dt = (Date.now() - at) / 700;
      if(dt >= 1){ poked[kind] = null; return 0; }
      return Math.sin(dt*Math.PI*4) * (1 - dt);
    }

    function cloud(x, y, k, kind){
      var s = k*U;
      y += wob(kind)*7*U;
      mark(kind, x, y, 40*s);
      s2.fillStyle = "rgba(255,255,255,.9)";
      s2.beginPath();
      s2.ellipse(x, y+13*s, 46*s, 17*s, 0, 0, TAU);
      s2.arc(x-24*s, y+3*s, 15*s, 0, TAU);
      s2.arc(x-2*s,  y-8*s, 21*s, 0, TAU);
      s2.arc(x+24*s, y+1*s, 14*s, 0, TAU);
      s2.fill();
    }

    function sun(t){
      var x = W*0.87, y = H*0.13;
      // the whole sun is drawn off r, so pulsing r pulses the rays and face too
      var r = Math.max(26, Math.min(W,H)*0.055) * (1 + wob("sun")*0.1);
      mark("sun", x, y, r*1.5);
      var g = s2.createRadialGradient(x,y,r*0.4, x,y,r*2.8);
      g.addColorStop(0,"rgba(255,214,68,.45)");
      g.addColorStop(1,"rgba(255,214,68,0)");
      s2.fillStyle = g;
      s2.beginPath(); s2.arc(x,y,r*2.8,0,TAU); s2.fill();
      s2.save();
      s2.translate(x,y); s2.rotate(t*0.06);
      s2.fillStyle = "rgba(255,199,54,.9)";
      for(var i=0;i<10;i++){
        s2.rotate(TAU/10);
        s2.beginPath();
        s2.ellipse(r*1.5, 0, r*0.26, r*0.09, 0, 0, TAU);
        s2.fill();
      }
      s2.restore();
      s2.fillStyle = "#ffd644";
      s2.beginPath(); s2.arc(x,y,r,0,TAU); s2.fill();
      s2.fillStyle = "rgba(255,138,110,.5)";
      s2.beginPath();
      s2.arc(x-r*0.48, y+r*0.22, r*0.14, 0, TAU);
      s2.arc(x+r*0.48, y+r*0.22, r*0.14, 0, TAU);
      s2.fill();
      s2.strokeStyle = "#7a5b1e";
      s2.lineWidth = Math.max(2, r*0.07);
      s2.lineCap = "round";
      s2.beginPath(); s2.arc(x-r*0.32, y-r*0.10, r*0.14, Math.PI*1.1, Math.PI*1.9); s2.stroke();
      s2.beginPath(); s2.arc(x+r*0.32, y-r*0.10, r*0.14, Math.PI*1.1, Math.PI*1.9); s2.stroke();
      s2.beginPath(); s2.arc(x, y+r*0.12, r*0.36, Math.PI*0.15, Math.PI*0.85); s2.stroke();
    }

    function plane(t){
      var k = U*1.1;
      var cyc = 36;
      var w = wob("plane");
      var x = -160 + ((t%cyc)/cyc)*(W+320);
      var y = H*0.15 + Math.sin(t*1.2)*7 + w*9;
      mark("plane", x, y, 44*k);
      s2.save(); s2.translate(x,y); s2.rotate(-0.05 + w*0.16); s2.scale(k,k);
      s2.fillStyle = "#ff8787";
      s2.beginPath(); s2.moveTo(-32,0);  s2.lineTo(-46,-17); s2.lineTo(-26,-7); s2.closePath(); s2.fill();
      s2.beginPath(); s2.moveTo(-4,4);   s2.lineTo(-22,22);  s2.lineTo(2,15);   s2.closePath(); s2.fill();
      s2.fillStyle = "#ffffff";
      s2.strokeStyle = "rgba(46,45,85,.25)"; s2.lineWidth = 1.5;
      s2.beginPath(); s2.ellipse(0,0,40,11,0,0,TAU); s2.fill(); s2.stroke();
      s2.fillStyle = "#dceafe";
      s2.beginPath(); s2.ellipse(3,4.5,36,6,0,0,TAU); s2.fill();
      s2.fillStyle = "#5b7ea8";
      for(var i=0;i<4;i++){ s2.beginPath(); s2.arc(-13+i*11,-3,2.7,0,TAU); s2.fill(); }
      s2.restore();
    }

    function balloon(t){
      var R = 34*U;
      var cyc = 75;
      var p = ((t%cyc)+cyc)%cyc/cyc;
      var x = W*0.12 + Math.sin(t*0.55)*16*U;
      var y = H*1.12 - p*(H*1.45);
      var w = wob("balloon");
      // the envelope sits above the anchor point, so the target does too
      mark("balloon", x, y - R*0.27, R*1.35);
      s2.save(); s2.translate(x,y); s2.rotate(Math.sin(t*0.55)*0.05 + w*0.17);
      function gore(sx, color){
        s2.save(); s2.scale(sx,1);
        s2.fillStyle = color;
        s2.beginPath();
        s2.moveTo(-R*0.3, R*0.92);
        s2.bezierCurveTo(-R*1.3, R*0.35, -R*1.1, -R*1.45, 0, -R*1.45);
        s2.bezierCurveTo( R*1.1, -R*1.45,  R*1.3, R*0.35, R*0.3, R*0.92);
        s2.closePath(); s2.fill();
        s2.restore();
      }
      gore(1,    "#ff6b6b");
      gore(0.66, "#ffd23f");
      gore(0.33, "#ff9ecd");
      s2.strokeStyle = "#8b6f47"; s2.lineWidth = Math.max(1.5, 2*U);
      s2.beginPath();
      s2.moveTo(-R*0.28, R*0.92); s2.lineTo(-R*0.16, R*1.35);
      s2.moveTo( R*0.28, R*0.92); s2.lineTo( R*0.16, R*1.35);
      s2.stroke();
      s2.fillStyle = "#c9995f";
      s2.fillRect(-R*0.22, R*1.35, R*0.44, R*0.32);
      s2.strokeStyle = "rgba(122,85,45,.6)"; s2.lineWidth = 1;
      s2.strokeRect(-R*0.22, R*1.35, R*0.44, R*0.32);
      s2.restore();
    }

    function kite(t){
      var s = U;
      var x = W*0.9  + Math.sin(t*0.7)*20*s;
      var y = H*0.62 + Math.cos(t*0.9)*14*s;
      mark("kite", x, y, 23*s);
      s2.save(); s2.translate(x,y); s2.rotate(Math.sin(t*0.7)*0.18 + 0.15 + wob("kite")*0.26);
      s2.strokeStyle = "#9d8bdb"; s2.lineWidth = 2*s; s2.lineCap = "round";
      s2.beginPath(); s2.moveTo(0, 20*s);
      s2.quadraticCurveTo( 8*s, 34*s, 2*s, 48*s);
      s2.quadraticCurveTo(-4*s, 62*s, 4*s, 74*s);
      s2.stroke();
      s2.fillStyle = "#ff6b6b";
      [[6,32],[0,52],[3,70]].forEach(function(b){
        s2.beginPath(); s2.arc(b[0]*s, b[1]*s, 3.4*s, 0, TAU); s2.fill();
      });
      s2.fillStyle = "#7c5ce0";
      s2.beginPath();
      s2.moveTo(0,-22*s); s2.lineTo(15*s,0); s2.lineTo(0,20*s); s2.lineTo(-15*s,0);
      s2.closePath(); s2.fill();
      s2.strokeStyle = "rgba(255,255,255,.55)"; s2.lineWidth = 1.6*s;
      s2.beginPath();
      s2.moveTo(0,-22*s); s2.lineTo(0,20*s);
      s2.moveTo(-15*s,0); s2.lineTo(15*s,0);
      s2.stroke();
      s2.restore();
    }

    function bird(t, o, yf, sp, sc, kind){
      var w = wob(kind);
      var x = ((t*sp + o) % (W+160)) - 80;
      var y = H*yf + Math.sin(t*1.7 + o)*8 - w*11;
      mark(kind, x, y, 17*sc);   // generously wider than the bird, for small fingers
      var flap = Math.sin(t*7 + o)*5*sc + w*4*sc;
      s2.strokeStyle = "#5a6b8c"; s2.lineWidth = 2.4*sc; s2.lineCap = "round";
      s2.beginPath();
      s2.moveTo(x-10*sc, y);
      s2.quadraticCurveTo(x-5*sc, y-7*sc-flap, x, y);
      s2.quadraticCurveTo(x+5*sc, y-7*sc-flap, x+10*sc, y);
      s2.stroke();
    }

    function hills(){
      s2.fillStyle = "#d7f3dd";
      s2.beginPath(); s2.ellipse(W*0.22, H*1.12, W*0.55, H*0.20, 0, 0, TAU); s2.fill();
      s2.fillStyle = "#c6ecd1";
      s2.beginPath(); s2.ellipse(W*0.82, H*1.14, W*0.62, H*0.22, 0, 0, TAU); s2.fill();
    }

    function tree(x, y){
      var s = U;
      mark("tree", x, y - 40*s, 27*s);
      s2.save();
      s2.translate(x, y); s2.rotate(wob("tree")*0.1); s2.translate(-x, -y);  // sway from the roots
      s2.fillStyle = "#a97455";
      s2.fillRect(x-4*s, y-30*s, 8*s, 30*s);
      s2.fillStyle = "#6fc98f";
      s2.beginPath();
      s2.arc(x-16*s, y-34*s, 15*s, 0, TAU);
      s2.arc(x+16*s, y-34*s, 15*s, 0, TAU);
      s2.arc(x,      y-46*s, 19*s, 0, TAU);
      s2.fill();
      s2.fillStyle = "#8ad8a5";
      s2.beginPath(); s2.arc(x-6*s, y-52*s, 10*s, 0, TAU); s2.fill();
      s2.restore();
    }

    function flower(x, y, t){
      var s = U;
      mark("flower", x, y - 26*s, 17*s);
      s2.save(); s2.translate(x,y); s2.rotate(Math.sin(t*0.9)*0.06 + wob("flower")*0.19);
      s2.strokeStyle = "#69b97e"; s2.lineWidth = 3.4*s; s2.lineCap = "round";
      s2.beginPath(); s2.moveTo(0,0); s2.quadraticCurveTo(2*s,-14*s, 0,-26*s); s2.stroke();
      s2.fillStyle = "#ffd23f";
      for(var i=0;i<6;i++){
        var a = i/6*TAU;
        s2.beginPath(); s2.arc(Math.cos(a)*8*s, -26*s + Math.sin(a)*8*s, 5.2*s, 0, TAU); s2.fill();
      }
      s2.fillStyle = "#a9744f";
      s2.beginPath(); s2.arc(0,-26*s,5*s,0,TAU); s2.fill();
      s2.restore();
    }

    function draw(t){
      spots.length = 0;
      s2.clearRect(0,0,W,H);
      sun(t);
      CLOUDS.forEach(function(c, i){
        var x = ((c.o + t*c.v) % (W+260)) - 130;
        cloud(x, H*c.y, c.s, "cloud" + i);
      });
      plane(t);
      bird(t, 0,   .30, 26, U,     "bird0");
      bird(t, 300, .25, 22, U*0.8, "bird1");
      balloon(t);
      kite(t);
      hills();
      tree(W*0.07, H*0.99);
      flower(W*0.94, H*0.995, t);
    }

    var SKY_SOUND = {
      sun:"sparkle", plane:"whoosh", balloon:"boing", kite:"wind",
      tree:"wind", flower:"twinkle", bird0:"chirp", bird1:"chirp",
      cloud0:"wind", cloud1:"wind", cloud2:"wind", cloud3:"wind"
    };
    function pokeSky(cx, cy){
      var best = null, bestD = Infinity;
      for(var i=0;i<spots.length;i++){
        var s = spots[i], dx = cx - s.x, dy = cy - s.y, d = dx*dx + dy*dy;
        if(d <= s.r*s.r && d < bestD){ bestD = d; best = s; }   // nearest centre wins
      }
      if(!best) return false;
      poked[best.kind] = Date.now();
      var v = VOICE[SKY_SOUND[best.kind]];
      if(v) try{ v(); }catch(e){}
      return true;
    }
    // Only between questions. During a round nothing should compete with the
    // cards, and a child hunting the balloon instead of answering is exactly
    // the distraction this would otherwise create.
    document.addEventListener("click", function(e){
      if(!$("screen-play").classList.contains("hidden")) return;
      // taps that landed on empty scenery only — never on a control, and
      // never through an open sticker book or grown-ups panel
      var t = e.target;
      if(t !== document.body && !(t.classList && t.classList.contains("stage"))) return;
      if(!pokeSky(e.clientX, e.clientY)) return;
      // poking the balloon shouldn't hurry a child off the victory screen
      if(!$("screen-victory").classList.contains("hidden")){
        holdVictory = true;
        clearTimeout(autoAdvanceTimer);
      }
    });

    resize();
    draw(20); // first frame right away, even in a background tab
    if(!reducedMotion){
      (function frame(now){
        if(!document.hidden) draw(20 + now/1000);
        requestAnimationFrame(frame);
      })(0);
    }
  })();

  /* ---------------- screens ---------------- */
  function show(id){
    ["screen-start","screen-play","screen-victory"].forEach(function(s){
      $(s).classList.toggle("hidden", s !== id);
    });
  }

  /* ---------------- rounds ---------------- */
  /* ---------------- difficulty ----------------
     Two dials, both aimed at the same thing: a child's first few minutes
     should be winnable. A flat 26-letter shuffle can open on Q, X or Z,
     and three cards is a lot to read when you know four letters.        */
  var MIN_CARDS = 2, MAX_CARDS = 4;
  var STEP_UP_AFTER = 3;        // clean rounds in a row before widening
  // The letters a preschooler tends to meet first: their shapes are
  // distinct and the words are things they can already name.
  var EASY = ["A","B","C","D","M","P","S","T"];
  // "Still finding their feet" is measured by the sticker book rather than
  // by rounds played, so it survives across sessions like everything else.
  function beginner(){ return Object.keys(book).length < 8; }

  // Whatever a grown-up has narrowed the game down to, or all 26.
  function activeLetters(){
    return (letterSet && letterSet.length >= 2) ? letterSet : LETTERS;
  }

  function nextLetter(){
    if(deck.length === 0){
      var pool = activeLetters();
      // pop() draws from the end, so the easy tier goes last to come out first
      if(beginner()){
        var easy = shuffle(pool.filter(function(l){ return EASY.indexOf(l) !== -1; }));
        var rest = shuffle(pool.filter(function(l){ return EASY.indexOf(l) === -1; }));
        deck = rest.concat(easy);
      }else{
        deck = shuffle(pool.slice());
      }
      // a fresh deck could deal the letter just played — move it to the bottom
      if(current && deck.length > 1 && deck[deck.length-1] === current.letter) deck.unshift(deck.pop());
    }
    return deck.pop();
  }

  // Widen after a few clean rounds, narrow the moment a round goes badly.
  function gradeRound(){
    if(wrongTaps === 0){
      cleanStreak++;
      if(cleanStreak >= STEP_UP_AFTER && level < MAX_CARDS){ level++; cleanStreak = 0; }
    }else{
      cleanStreak = 0;
      if(wrongTaps >= 2 && level > MIN_CARDS) level--;
    }
  }

  /* ---------------- stuck detection ----------------
     A child who has run out of ideas gets nothing back today but silence.
     After a couple of misses, or a long enough pause, the right card starts
     bobbing. It costs no stars: hesitating isn't a mistake.              */
  /* ---------------- round type ----------------
     The reverse round turns the question around: the picture asks, and the
     answer is a letter. It's the harder direction — recognising a letter
     among letters, with no drawing to lean on — so it stays out of the way
     until a child is past the beginner deck and holding three cards, and
     it never runs twice in a row.                                        */
  function pickMode(){
    if(beginner() || level < 3) return "normal";
    if(mode === "reverse") return "normal";
    return Math.random() < 0.34 ? "reverse" : "normal";
  }

  var HINT_AFTER = 7000;
  function showHint(){
    if(solvedThisRound || !correctBtn) return;
    if(correctBtn.classList.contains("hint")) return;
    correctBtn.classList.add("hint");
    tone(660, 0, 0.18, "sine", 0.1);
    tone(880, 0.12, 0.22, "sine", 0.1);
  }
  function armHint(delay){
    clearTimeout(hintTimer);
    hintTimer = setTimeout(showHint, delay);
  }

  // Everything the round has in flight: the auto-advance, the narration it is
  // waiting on, the bobbing hint, the scheduled victory chimes. Leave any of
  // these running and they fire into whatever screen comes next — which is why
  // the Android back button calls this before stepping back to the start.
  function stopRound(){
    clearTimeout(autoAdvanceTimer);
    clearTimeout(victoryDelayTimer);
    clearTimeout(victorySpeechTimer);
    clearTimeout(wrongSpeechTimer);
    clearTimeout(hintTimer);
    clearTimeout(promptTimer);
    victorySoundTimers.forEach(function(t){ clearTimeout(t); });
    victorySoundTimers.length = 0;
    settleJar();
  }

  function newRound(){
    stopRound();
    solvedThisRound = false;
    filledJarThisRound = false;
    wrongTaps = 0;
    correctBtn = null;
    mode = pickMode();
    var reverse = mode === "reverse";
    var letter = nextLetter();
    current = { letter: letter, word: pick(WORDS[letter]) };

    // distractors from other letters in play, skipping sound-alike letters
    var avoid = CONFUSABLE[letter] || [];
    var pool = activeLetters();
    var others = shuffle(pool.filter(function(l){ return l !== letter && avoid.indexOf(l) === -1; }));
    // a tight letter set can filter every distractor away — better a
    // sound-alike than a lone card with nothing to choose between
    if(!others.length) others = shuffle(pool.filter(function(l){ return l !== letter; }));
    var options = [current];
    for(var i=0; options.length < level && i < others.length; i++){
      options.push({ letter: others[i], word: pick(WORDS[others[i]]) });
    }
    shuffle(options);
    roundOptions = options;
    preloadRound();

    // the prompt is a letter normally, and the picture itself in reverse
    $("letter-block").classList.toggle("hidden", reverse);
    $("picture-block").classList.toggle("hidden", !reverse);
    $("prompt-text").textContent = reverse
      ? "Which letter does this picture start with?"
      : "Which picture starts with this letter?";

    if(reverse){
      var pic = $("picture-block");
      pic.innerHTML = '<span class="mat">' + ART[current.word] + '</span>';
      pic.setAttribute("aria-label", sayable(current.word) + ". Hear it again");
      restart(pic);
    }else{
      var block = $("letter-block");
      block.textContent = letter;
      block.appendChild(lowerHalf(letter));
      restart(block);
    }

    var holder = $("cards");
    holder.innerHTML = "";
    options.forEach(function(opt){
      var b = document.createElement("button");
      b.className = reverse ? "card letter-card" : "card";
      if(reverse){
        b.textContent = opt.letter;
        b.appendChild(lowerHalf(opt.letter));
        b.setAttribute("aria-label", "letter " + opt.letter);
      }else{
        b.innerHTML = ART[opt.word];
        b.setAttribute("aria-label", opt.word.toLowerCase());
      }
      b.addEventListener("click", function(){ onCard(b, opt); });
      if(opt.letter === letter) correctBtn = b;
      holder.appendChild(b);
    });

    show("screen-play");
    openPrompt();
    armHint(HINT_AFTER);
  }

  // the small trailing lowercase in "B b", so both cases are always paired
  function lowerHalf(letter){
    var s = document.createElement("span");
    s.className = "lower";
    s.textContent = letter.toLowerCase();
    return s;
  }
  // replay a CSS entrance animation on an element that is being reused
  function restart(el){
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "";
  }

  function onCard(btn, opt){
    if(solvedThisRound) return;
    if(opt.letter === current.letter){
      solvedThisRound = true;
      clearTimeout(hintTimer);
      btn.classList.remove("hint");
      btn.classList.add("right");
      gradeRound();
      // the picture speaks for itself first; the party horn follows so the
      // two don't smear into one noise
      playPicture(current.word);
      setTimeout(fanfare, 420);
      burstConfetti();
      earnedThisRound = wrongTaps === 0 ? 3 : wrongTaps === 1 ? 2 : 1;
      var before = stars;
      stars += earnedThisRound;
      sessionStars += earnedThisRound;
      filledJarThisRound = Math.floor(stars/JAR) > Math.floor(before/JAR);
      collect(current.letter, current.word);
      saveProgress();
      flyStars(btn);
      victoryDelayTimer = setTimeout(showVictory, reducedMotion ? 150 : 750);
    }else{
      wrongTaps++;
      btn.classList.add("wrong");
      chimeWrong();
      // a second miss means they're guessing — nudge once the teaching line
      // has landed, rather than talking over it
      armHint(wrongTaps >= 2 ? 1500 : HINT_AFTER);
      // teach instead of just rejecting: let the picture make its noise, then
      // name what they tapped and which letter it belongs to
      setTimeout(function(){ playPicture(opt.word); }, 230);
      clearTimeout(wrongSpeechTimer);
      wrongSpeechTimer = setTimeout(function(){
        // Both directions name what was tapped, never what was wanted —
        // saying "cow starts with C" in a reverse round would hand over
        // the answer the child is being asked for.
        var soft = { pitch: 1.1, rate: 0.95 };
        var slots = { letter: opt.letter, word: opt.word };
        speakParts(mode === "reverse" ? [
          line("letter.excl", { letter: opt.letter }, soft),
          // the victory clip, said a shade quicker and flatter than a cheer
          line("teach.is-for", slots, { pitch: 1.05, rate: 0.9 }),
          line("retry.try-again")
        ] : [
          line("word.excl", { word: opt.word }, soft),
          line("teach.starts-with", slots),
          line("retry.try-again")
        ]);
      }, 900);
    }
  }

  function showVictory(){
    $("victory-art").innerHTML = ART[current.word];
    $("is-for").textContent = current.letter + " is for…";

    var tiles = $("word-tiles");
    tiles.innerHTML = "";
    var chars = current.word.split("");
    var shown = 0;
    chars.forEach(function(ch, i){
      var t = document.createElement("div");
      t.className = "tile";
      if(ch === " " || ch === "-"){
        t.style.visibility = "hidden";
        t.style.borderWidth = "0";
        t.style.boxShadow = "none";
        t.style.padding = "0 6px";
      } else if(shown === 0){
        t.className += " first";
      }
      if(ch !== " " && ch !== "-") shown++;
      t.textContent = ch === " " ? " " : ch;
      var delay = reducedMotion ? 0 : 0.35 + i*0.22;
      t.style.animationDelay = delay + "s";
      if(!reducedMotion && ch !== " " && ch !== "-"){
        victorySoundTimers.push(setTimeout(function(){ chimeTile(i); }, delay*1000));
      }
      tiles.appendChild(t);
    });

    // round rating: 3 stars for a one-shot, 2 for one miss, 1 otherwise
    var slots = $("victory-stars");
    slots.innerHTML = "";
    var starBase = reducedMotion ? 0 : 0.5 + chars.length*0.22;
    for(var s=0; s<3; s++){
      var sp = document.createElement("span");
      sp.textContent = "⭐";
      if(s < earnedThisRound){
        sp.className = "won";
        var sDelay = starBase + s*0.3;
        sp.style.animationDelay = sDelay + "s";
        if(!reducedMotion){
          (function(n, when){
            victorySoundTimers.push(setTimeout(function(){ tone(660*Math.pow(1.26, n), 0, 0.25, "triangle", 0.15); }, when*1000));
          })(s, sDelay);
        }
      }else{
        sp.className = "lost";
      }
      slots.appendChild(sp);
    }

    show("screen-victory");

    clearTimeout(autoAdvanceTimer);
    clearTimeout(victorySpeechTimer);
    holdVictory = false;
    if(muted || !willSpeak()){
      // no narration to wait for — just give a bit longer to look at the word
      autoAdvanceTimer = setTimeout(newRound, 5000);
    }else{
      // a filled jar outranks the usual cheer — it only happens every 16 stars
      var cheer = cheerLine();
      var wait = reducedMotion ? 100 : (filledJarThisRound ? 1500 : 900);
      victorySpeechTimer = setTimeout(function(){
        speakParts([
          cheer,
          line("teach.is-for", { letter: current.letter, word: current.word })
        ], function(){
          // the countdown only starts once narration ends, so a tap on the
          // picture before then has to be remembered, not just cleared
          if(holdVictory) return;
          autoAdvanceTimer = setTimeout(newRound, 3000);
        });
      }, wait);
    }
  }

  /* ---------------- wiring ---------------- */
  $("start-art-1").innerHTML = ART.BEE;
  $("start-art-2").innerHTML = ART.APPLE;
  window.ALPHABET_ART = ART;             // handy for eyeballing every drawing in devtools
  window.ALPHABET_SOUND = playPicture;   // ...and for auditioning any word's noise
  window.ALPHABET_VOICE = {
    manifest: voiceManifest, lines: LINES, line: line,
    // what the narrator is doing right now, for poking at in devtools
    player: function(){ return voicePack; },
    recorded: function(){ return useVoicePack; },
    say: function(parts, done){ speakParts(parts, done); }
  };
  $("play-btn").addEventListener("click", function(){
    audio();               // unlock audio on user gesture (iOS)
    unlockSpeech();        // unlock speech on user gesture (iOS)
    startMusic();
    newRound();
  });
  $("next-btn").addEventListener("click", newRound);
  $("repeat-btn").addEventListener("click", openPrompt);
  // the reverse prompt is pokeable too, for the noise on its own
  $("picture-block").addEventListener("click", function(){ playPicture(current.word); });
  // The winning picture stays pokeable on the victory screen. Poking it also
  // calls off the auto-advance, so a child who wants to make the cow moo
  // eleven times is never hurried off the screen.
  $("victory-art").addEventListener("click", function(){
    holdVictory = true;
    clearTimeout(autoAdvanceTimer);
    clearTimeout(victorySpeechTimer);
    playPicture(current.word);
  });

  /* ---------------- sticker jar and book ---------------- */
  loadProgress();
  shownStars = stars;
  lastCelebrated = shownStars;   // don't re-celebrate a jar filled last session
  paintJar();
  $("jar-btn").addEventListener("click", openBook);
  $("book-close").addEventListener("click", closeBook);
  $("book").addEventListener("click", function(e){ if(e.target === $("book")) closeBook(); });
  /* ---------------- grown-ups panel ----------------
     Everything a parent sets rather than plays, behind a long press on the
     sticker book title — a gesture a preschooler mashing the screen won't
     stumble onto, and one a grown-up only has to be told about once.    */
  var holdTimer = null;
  function armGrownups(){
    clearTimeout(holdTimer);
    holdTimer = setTimeout(openGrownups, 1500);
  }
  function cancelGrownups(){ clearTimeout(holdTimer); }
  ["mousedown","touchstart"].forEach(function(ev){ $("book-title").addEventListener(ev, armGrownups); });
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){ $("book-title").addEventListener(ev, cancelGrownups); });

  function paintNames(){
    $("start-title").textContent = childName ? childName + "'s Alphabet Match!" : "Alphabet Match!";
    $("book-title").textContent = childName ? childName + "'s Sticker Book" : "My Sticker Book";
  }
  // the distinct A-Z letters in the name, for the "just the name" preset
  function nameLetters(){
    var seen = {}, out = [];
    childName.toUpperCase().split("").forEach(function(ch){
      if(LETTERS.indexOf(ch) !== -1 && !seen[ch]){ seen[ch] = 1; out.push(ch); }
    });
    return out.sort();
  }
  function applyLetters(set){
    // the full alphabet is the default, and is stored as null rather than a list
    letterSet = (set && set.length >= 2 && set.length < LETTERS.length) ? set.slice().sort() : null;
    deck = [];            // re-deal from the new set as soon as the round turns
    saveProgress();
    renderLetterPicker();
  }
  function renderLetterPicker(){
    var on = activeLetters();
    var wrap = $("gu-letters");
    wrap.innerHTML = "";
    LETTERS.forEach(function(l){
      var b = document.createElement("button");
      var isOn = on.indexOf(l) !== -1;
      b.className = "gu-letter" + (isOn ? " on" : "");
      b.textContent = l;
      b.setAttribute("aria-pressed", isOn ? "true" : "false");
      b.setAttribute("aria-label", l + (isOn ? ", in play" : ", not in play"));
      b.addEventListener("click", function(){
        var set = activeLetters().slice();
        var at = set.indexOf(l);
        if(at === -1) set.push(l);
        else if(set.length > 2) set.splice(at, 1);   // never fewer than two
        else return;
        applyLetters(set);
      });
      wrap.appendChild(b);
    });
    var n = on.length;
    $("gu-count").textContent = n === LETTERS.length
      ? "All 26 letters are in play."
      : n + " letters in play. Rounds only use these.";
    $("pick-name").disabled = nameLetters().length < 2;
  }
  function openGrownups(){
    $("name-input").value = childName;
    renderLetterPicker();
    disarmReset();
    $("grownups").classList.remove("hidden");
  }
  function closeGrownups(){
    $("grownups").classList.add("hidden");
    disarmReset();
    renderBook();          // the title may have gained a name
  }
  $("gu-close").addEventListener("click", closeGrownups);
  $("grownups").addEventListener("click", function(e){ if(e.target === $("grownups")) closeGrownups(); });
  $("name-input").addEventListener("input", function(){
    childName = this.value.trim().slice(0, NAME_MAX);
    paintNames();
    renderLetterPicker();  // enables or greys the "just the name" preset
    saveProgress();
  });
  $("pick-all").addEventListener("click", function(){ applyLetters(null); });
  $("pick-name").addEventListener("click", function(){ applyLetters(nameLetters()); });

  // Erasing is two taps: the panel already keeps children out, but a parent
  // can still fat-finger a button that throws away weeks of stickers.
  var resetArmed = null;
  function disarmReset(){
    clearTimeout(resetArmed);
    resetArmed = null;
    var b = $("book-reset");
    b.classList.remove("armed");
    b.textContent = "Erase stars and stickers";
  }
  $("book-reset").addEventListener("click", function(){
    var b = $("book-reset");
    if(!resetArmed){
      b.classList.add("armed");
      b.textContent = "Tap again to erase";
      resetArmed = setTimeout(disarmReset, 4000);
      return;
    }
    stars = 0; shownStars = 0; lastCelebrated = -1; book = {};
    // back to a beginner in every sense: two cards, and the easy letters
    // dealt first again once the current deck runs out
    level = MIN_CARDS; cleanStreak = 0; deck = [];
    saveProgress();
    paintJar();
    renderBook();
    disarmReset();
  });
  paintNames();
  /* ---------------- full screen ----------------
     Worth having on a tablet: it hides the browser chrome, so a four-year-
     old aiming at a card can't land on the address bar instead. The button
     hides itself where the API doesn't exist (an iPhone), and the request
     has to ride on the tap — browsers refuse it otherwise.              */
  function fullscreenEl(){
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function fullscreenAvailable(){
    // the native shell is already full screen, so the button would be a
    // control that visibly does nothing; paintFullscreenBtn() hides it
    if(isNative) return false;
    var d = document.documentElement;
    return !!(d.requestFullscreen || d.webkitRequestFullscreen) &&
           document.fullscreenEnabled !== false && document.webkitFullscreenEnabled !== false;
  }
  function enterFullscreen(){
    var d = document.documentElement;
    var req = d.requestFullscreen || d.webkitRequestFullscreen;
    if(!req) return Promise.resolve(false);
    // navigationUI:"hide" is a hint; Safari ignores the argument entirely.
    return Promise.resolve(req.call(d, { navigationUI:"hide" })).then(function(){ return true; },
                                                                     function(){ return false; });
  }
  function exitFullscreen(){
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if(!ex) return Promise.resolve(false);
    return Promise.resolve(ex.call(document)).then(function(){ return true; }, function(){ return false; });
  }
  function toggleFullscreen(){
    return fullscreenEl() ? exitFullscreen() : enterFullscreen();
  }
  function paintFullscreenBtn(){
    var b = $("full-btn");
    var on = !!fullscreenEl();
    b.classList.toggle("hidden", !fullscreenAvailable());
    b.innerHTML = on ? ICON.shrink : ICON.expand;
    b.setAttribute("aria-label", on ? "Leave full screen" : "Fill the whole screen");
    b.setAttribute("aria-pressed", on ? "true" : "false");
  }
  paintFullscreenBtn();
  $("full-btn").addEventListener("click", function(){ toggleFullscreen(); });
  document.addEventListener("fullscreenchange", paintFullscreenBtn);
  document.addEventListener("webkitfullscreenchange", paintFullscreenBtn);
  // F for grown-ups who never let go of the keyboard.
  document.addEventListener("keydown", function(e){
    if((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey){
      toggleFullscreen();
    }
  });

  $("mute-btn").addEventListener("click", function(){
    muted = !muted;
    $("mute-btn").textContent = muted ? "🔇" : "🔊";
    if(muted){
      if(voicePack) voicePack.cancel();
      if("speechSynthesis" in window) window.speechSynthesis.cancel();
      stopMusic();
    }else if(actx){
      startMusic();
    }
  });
  document.addEventListener("visibilitychange", function(){
    if(!actx) return;
    if(document.hidden){ actx.suspend(); }
    else if(actx.state === "suspended"){ actx.resume(); }
  });

  /* ---------------- the native shell ----------------
     Everything the packaged builds need and a browser tab does not. The
     plugin proxies only answer where a native bridge injected itself, so
     the whole section is skipped on the web rather than guarded call by
     call — nothing below has a browser equivalent worth running.       */
  if(isNative && window.Capacitor && window.Capacitor.registerPlugin){
    var CapApp = window.Capacitor.registerPlugin("App");
    var CapPrefs = window.Capacitor.registerPlugin("Preferences");
    var CapBars = window.Capacitor.registerPlugin("StatusBar");
    var CapSplash = window.Capacitor.registerPlugin("SplashScreen");

    // The splash is held open by hand (launchAutoHide is off in
    // capacitor.config.json) and dropped here, once the start screen has
    // actually been painted. Left on its timer it hides after a fixed half
    // second, which on a cold first launch is before the web view has drawn
    // anything — and the seam between the two shows as a white flash.
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ CapSplash.hide().catch(function(){}); });
    });

    // A clock and a battery icon over a game played by aiming at big shapes
    // are just two more things to poke. iOS hides it from Info.plist so
    // there's no flash of one at launch; this is here for Android, and is a
    // no-op where the plist already did it. The stage keeps padding itself
    // by env(safe-area-inset-top), so a notch still gets its clearance.
    if(CapBars.hide) CapBars.hide().catch(function(){});

    /* ---- progress that survives the operating system ----
       A web view's localStorage is not durable storage: iOS clears a web
       view's data store when the device runs short of space, and Android
       will do the same from the app's own storage settings. Losing the
       sticker book is the one failure this game can't absorb — it's the
       whole reason a child comes back. UserDefaults / SharedPreferences are
       backed up and never evicted, so they hold a copy while localStorage
       stays the live, synchronous store the rest of the file reads.     */
    function mirrorProgress(){
      var raw = null;
      try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
      if(raw != null) CapPrefs.set({ key: SAVE_KEY, value: raw }).catch(function(){});
    }
    onProgressSaved = mirrorProgress;

    // Restore only into an empty web view. A populated localStorage is
    // always the fresher of the two, and this read is asynchronous — by the
    // time it lands the child may already be playing, and rewinding them to
    // a backup mid-round would look exactly like a bug.
    (function restoreProgress(){
      var have = null;
      try{ have = localStorage.getItem(SAVE_KEY); }catch(e){}
      if(have != null) return mirrorProgress();     // nothing lost; refresh the copy
      CapPrefs.get({ key: SAVE_KEY }).then(function(res){
        var raw = res && res.value;
        if(!raw) return;
        if($("screen-start").classList.contains("hidden")) return;   // too late, they've started
        try{ localStorage.setItem(SAVE_KEY, raw); }catch(e){}
        loadProgress();
        shownStars = stars;
        lastCelebrated = shownStars;
        paintJar();
        paintNames();
      }).catch(function(){});
    })();

    /* ---- Android's back button ----
       It has to do something, and quitting outright is the wrong something:
       the button is at toddler height and gets found by accident. So it
       unwinds whatever is on top — panel, then book, then the round itself
       — and only once there's nothing left to close does it drop the app to
       the background, which is recoverable, rather than exiting.        */
    CapApp.addListener("backButton", function(){
      if(!$("grownups").classList.contains("hidden")) return closeGrownups();
      if(!$("book").classList.contains("hidden")) return closeBook();
      if($("screen-start").classList.contains("hidden")){
        stopRound();
        if(voicePack) voicePack.cancel();
        if("speechSynthesis" in window) window.speechSynthesis.cancel();
        show("screen-start");
        return;
      }
      CapApp.minimizeApp();
    });

    // The iOS audio session is a playback one (see AppDelegate), which left
    // alone would happily keep the music going over whatever the parent
    // switched to. visibilitychange covers this in a browser; inside a web
    // view it is the less reliable of the two, so listen for both.
    CapApp.addListener("appStateChange", function(s){
      if(!actx) return;
      if(s && s.isActive){
        if(actx.state === "suspended") actx.resume();
      }else{
        if(voicePack) voicePack.cancel();
        actx.suspend();
      }
    });
  }
})();
</script>
</body>
</html>
